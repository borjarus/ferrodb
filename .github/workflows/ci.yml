name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt + clippy + deny + typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - name: Linux GUI dependencies
        run: ./xtask/linux-deps.sh
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: crate-ci/typos@v1

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: ./xtask/linux-deps.sh
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Build
        run: cargo build --workspace --locked
      - name: Tests (unit + UI without window)
        run: cargo nextest run --workspace --locked --no-fail-fast
      - name: Doc tests
        run: cargo test --workspace --doc --locked

  package:
    name: package hello (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: ./xtask/linux-deps.sh
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-packager --locked
      - run: cargo xtask package
      - uses: actions/upload-artifact@v4
        with:
          name: ferrodb-${{ matrix.os }}
          path: target/packages/*
