[package]
name = "ferrodb-ai"
description = "Phase 9: AI query assistant, permission layer for agents, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ferrodb-api.workspace = true
ferrodb-secrets.workspace = true
async-channel.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "net", "io-util", "macros"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
thiserror.workspace = true
# assistant HTTP (phase 9.1): rustls + ring only, no aws-lc / OpenSSL
reqwest.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
# MCP server (phase 9.2/9.3)
ring.workspace = true
bson = { workspace = true, features = ["serde_json-1"] }
arrow-cast.workspace = true
bytes.workspace = true
tokio-util.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
rmcp = { workspace = true, features = [
  "server",
  "client",
  "transport-streamable-http-server",
  "transport-streamable-http-client-reqwest",
  "transport-io",
] }

[dev-dependencies]
ferrodb-mock.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
