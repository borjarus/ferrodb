[package]
name = "ferrodb-drivers"
description = "Driver, Connection and FamilyVariant traits, registry, native driver families (SQLite, PostgreSQL, MySQL, MongoDB)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["sqlite", "pgwire", "mysql", "mongodb"]
sqlite = ["dep:rusqlite"]
pgwire = ["dep:tokio-postgres", "dep:tokio-postgres-rustls", "dep:tokio-rustls", "dep:ring"]
mysql = ["dep:mysql_async"]
mongodb = ["dep:mongodb"]
duckdb = ["dep:duckdb"]
redis = ["dep:redis"]
cql = ["dep:scylla", "dep:async-trait"]
dynamodb = ["dep:aws-config", "dep:aws-sdk-dynamodb", "dep:aws-smithy-http-client", "dep:base64"]
couchbase = ["dep:reqwest", "dep:base64"]
# SQL Server and Azure SQL (TDS, `tiberius`, rustls).
tds = ["dep:tiberius", "dep:tokio-rustls", "dep:ring", "tokio-util/compat"]

[dependencies]
ferrodb-api.workspace = true
ferrodb-net.workspace = true
ferrodb-lang.workspace = true
bson.workspace = true
futures.workspace = true
bytes.workspace = true
tokio = { workspace = true, features = ["process"] }
serde_json.workspace = true
tokio-util.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
chrono.workspace = true
tracing.workspace = true
rustls.workspace = true
rusqlite = { workspace = true, optional = true }
tokio-postgres = { workspace = true, optional = true }
tokio-postgres-rustls = { workspace = true, optional = true }
mysql_async = { workspace = true, optional = true }
mongodb = { workspace = true, optional = true }
duckdb = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
scylla = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }
aws-sdk-dynamodb = { workspace = true, optional = true }
aws-smithy-http-client = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
tiberius = { workspace = true, optional = true }
# HTTPS calls for cloud authentication (Redshift IAM, Microsoft Entra ID).
tokio-rustls = { workspace = true, optional = true }
ring = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
