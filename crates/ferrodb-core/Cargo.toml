[package]
name = "ferrodb-core"
description = "Real backend: data sources, sessions, execution, transactions, history"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["duckdb"]
# DuckDB file data sources (compiles DuckDB from C++ sources).
duckdb = ["ferrodb-drivers/duckdb"]

[dependencies]
ferrodb-api.workspace = true
ferrodb-lang.workspace = true
ferrodb-drivers = { workspace = true, features = ["sqlite", "pgwire", "mysql", "mongodb", "redis", "cql", "dynamodb", "couchbase", "tds", "clickhouse"] }
ferrodb-adbc.workspace = true
ferrodb-meta.workspace = true
ferrodb-data.workspace = true
ferrodb-script.workspace = true
ferrodb-jdbc.workspace = true
ferrodb-driver-manager.workspace = true
bson = { workspace = true, features = ["serde", "serde_json-1"] }
serde_json.workspace = true
ferrodb-secrets.workspace = true
ferrodb-net.workspace = true
ferrodb-storage.workspace = true
futures.workspace = true
async-channel.workspace = true
tokio.workspace = true
tokio-util.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }
tempfile.workspace = true
# The UI's mock catalog of the 26 databases: real descriptors must match it.
ferrodb-mock.workspace = true

[lints]
workspace = true
