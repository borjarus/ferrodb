[workspace]
resolver = "3"
members = [
  "crates/ferrodb-api",
  "crates/ferrodb-mock",
  "crates/ferrodb-ui-kit",
  "crates/ferrodb-ui",
  "crates/ferrodb-app",
  "crates/ferrodb-lang",
  "crates/ferrodb-drivers",
  "crates/ferrodb-driver-tck",
  "crates/ferrodb-secrets",
  "crates/ferrodb-net",
  "crates/ferrodb-storage",
  "crates/ferrodb-meta",
  "crates/ferrodb-core",
  "crates/ferrodb-data",
  "crates/ferrodb-jdbc",
  "crates/ferrodb-driver-manager",
  "apps/ferrodb-gallery",
  "xtask",
  "spikes/gui",
  "spikes/adbc",
  "spikes/jdbc-bridge/reader",
]
default-members = ["crates/ferrodb-app"]
# Vendored third-party crates are built as dependencies, not linted as members.
exclude = ["third_party"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"
repository = "https://example.invalid/ferrodb"

[workspace.dependencies]
# internal
ferrodb-api = { path = "crates/ferrodb-api" }
ferrodb-mock = { path = "crates/ferrodb-mock" }
ferrodb-ui-kit = { path = "crates/ferrodb-ui-kit" }
ferrodb-ui = { path = "crates/ferrodb-ui" }
ferrodb-lang = { path = "crates/ferrodb-lang" }
ferrodb-drivers = { path = "crates/ferrodb-drivers", default-features = false }
ferrodb-driver-tck = { path = "crates/ferrodb-driver-tck" }
ferrodb-secrets = { path = "crates/ferrodb-secrets" }
ferrodb-net = { path = "crates/ferrodb-net" }
ferrodb-storage = { path = "crates/ferrodb-storage" }
ferrodb-core = { path = "crates/ferrodb-core" }
ferrodb-meta = { path = "crates/ferrodb-meta" }
ferrodb-data = { path = "crates/ferrodb-data" }
ferrodb-jdbc = { path = "crates/ferrodb-jdbc" }
ferrodb-driver-manager = { path = "crates/ferrodb-driver-manager" }

# GUI — exactly pinned (pins the gpui-pre 0.3.10 snapshot); see ADR-001
gpui-kit = { version = "=0.8.1" }

# async / bridge
futures = "0.3.34"
async-channel = "2.5.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-util = "0.7.20"
bytes = "1.12.1"

# data
arrow-array = "60.1.0"
arrow-schema = "60.1.0"
arrow-ipc = "60.1.0"
bson = "3.1.0"
chrono = "0.4.45"

# drivers (phase 3) — rustls with the `ring` provider everywhere (no cmake/NASM on Windows)
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["ring"] }
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal-rust", "derive", "rustls-tls", "tls12", "ring"] }
mongodb = { version = "3.10.0", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls", "dns-resolver"] }
rusqlite = { version = "0.41.1", features = ["bundled", "column_decltype"] }
# DuckDB compiled from source (C++), with the Parquet and JSON readers: file data sources (phase 7).
duckdb = { version = "=1.20000.2", default-features = false, features = ["bundled", "parquet", "json"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# TDS (SQL Server, Azure SQL; phase 8): rustls only, SSPI integrated auth on Windows.
# Vendored with patches (raw token stream, attention, sql_variant): see
# third_party/tiberius/Cargo.toml.
tiberius = { path = "third_party/tiberius", default-features = false, features = ["tds73", "rustls", "winauth"] }
ring = "0.17.14"
roxmltree = "0.21.2"
russh = { version = "0.65.1", default-features = false, features = ["flate2", "ring", "rsa"] }
# NoSQL drivers (phase 8): Redis (tokio + rustls/ring, cluster, Sentinel) and
# Apache Cassandra through the ScyllaDB driver (its rustls feature would pull
# aws-lc-rs, so CQL TLS is not compiled in; see docs/phase-8.md).
redis = { version = "1.8.2", default-features = false, features = ["acl", "streams", "aio", "tokio-comp", "tokio-rustls-comp", "tls-rustls-insecure", "cluster-async", "sentinel"] }
scylla = { version = "1.10.0", default-features = false }
async-trait = "0.1.92"
# DynamoDB (phase 8): the official AWS SDK without its default HTTPS client
# (that one is rustls + aws-lc, which needs cmake/NASM on Windows); the
# smithy hyper client is built with rustls + ring instead.
aws-config = { version = "1.13.3", default-features = false, features = ["rt-tokio", "sso", "credentials-process", "behavior-version-latest"] }
aws-sdk-dynamodb = { version = "1.140.0", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-smithy-http-client = { version = "1.5.3", default-features = false, features = ["rustls-ring"] }
# Couchbase (phase 8): REST services (query, cluster manager) over HTTP,
# rustls with the process-wide ring provider.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
base64 = "0.22.1"

# languages
sqlparser = "0.63.0"

# export / import (phase 6)
csv = "1.4.0"
rust_xlsxwriter = { version = "0.102.0", features = ["constant_memory"] }
calamine = "0.38.0"
# Pure-Rust codecs only (no C toolchain): snappy.
parquet = { version = "60.1.0", default-features = false, features = ["arrow", "snap"] }

# secrets / storage
keyring = "4.2.0"

# config / serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.0"
directories = "6.0.0"

# driver manager / JDBC bridge (phase 8): downloads over rustls + ring, SHA-256, archives
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
sha2 = "0.10.9"
zip = { version = "9.6.1", default-features = false, features = ["deflate-flate2"] }
flate2 = "1.1.10"
tar = "0.4.46"
arrow-buffer = "60.1.0"

# tests
proptest = "1"
tempfile = "3"

# misc
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
fluent-bundle = "0.16.0"
unic-langid = { version = "0.9.6", features = ["macros"] }
nucleo-matcher = "0.3.1"

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
# GPUI types (Context, Window…) carry lifetimes; spelling them out adds noise only.
elided_lifetimes_in_paths = "allow"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev]
# GPUI is heavy; keep deps optimized so the UI is usable in debug builds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
