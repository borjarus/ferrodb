# Couchbase SQL++ (N1QL) for Couchbase Server 7.6.
# Standalone dialect (JSON documents, not SQL): nothing is inherited.
id = "sqlpp"
name = "SQL++"
identifier_quote = '`'
case_folding = "none"
parser = ""

keywords = [
  "advise", "all", "alter", "analyze", "and", "any", "array", "as", "asc", "at", "begin",
  "between", "binary", "boolean", "break", "bucket", "build", "by", "call", "case", "cast",
  "cluster", "collate", "collection", "commit", "committed", "connect", "continue",
  "correlated", "cover", "create", "current", "database", "dataset", "datastore", "declare",
  "decrement", "delete", "derived", "desc", "describe", "distinct", "do", "drop", "each",
  "element", "else", "end", "escape", "every", "except", "exclude", "execute", "exists",
  "explain", "false", "fetch", "filter", "first", "flatten", "flatten_keys", "flush",
  "following", "for", "force", "from", "fts", "function", "golang", "grant", "group", "groups",
  "gsi", "hash", "having", "if", "ignore", "ilike", "in", "include", "increment", "index",
  "infer", "inline", "inner", "insert", "intersect", "into", "is", "isolation", "javascript",
  "join", "key", "keys", "keyspace", "known", "language", "last", "left", "let", "letting",
  "level", "like", "limit", "lsm", "map", "mapping", "matched", "materialized", "merge",
  "minus", "missing", "namespace", "nest", "nl", "no", "not", "not_a_token", "nth_value",
  "null", "nulls", "number", "object", "offset", "on", "option", "options", "or", "order",
  "others", "outer", "over", "parse", "partition", "password", "path", "pool", "preceding",
  "prepare", "primary", "private", "privilege", "probe", "procedure", "public", "range", "raw",
  "read", "realm", "recursive", "reduce", "rename", "replace", "respect", "restart", "restrict",
  "return", "returning", "revoke", "right", "role", "roles", "rollback", "row", "rows",
  "satisfies", "savepoint", "schema", "scope", "select", "self", "semi", "set", "show", "some",
  "start", "statistics", "string", "system", "then", "ties", "to", "tran", "transaction",
  "trigger", "true", "truncate", "unbounded", "under", "union", "unique", "unknown", "unnest",
  "unset", "update", "upsert", "use", "user", "users", "using", "validate", "value", "valued",
  "values", "via", "view", "when", "where", "while", "window", "with", "within", "work", "xor",
]

soft_keywords = [
  "meta", "sequence", "next", "prev", "nextval", "prevval", "maxvalue", "minvalue", "cycle",
  "cache", "defer_build", "num_replica", "nodes", "replica", "num_partition", "query_context",
  "scan_consistency", "not_bounded", "request_plus", "statement_plus", "at_plus",
  "durability_level", "txtimeout", "tximplicit", "use_cbo", "use_fts", "ordinality", "default",
]

types = [
  "missing", "null", "boolean", "number", "string", "array", "object", "binary",
]

[[functions]]
name = "array_agg"
signatures = ["array_agg(expression any) -> array"]
doc = "Array of the non-MISSING values in the group."

[[functions]]
name = "avg"
signatures = ["avg(expression number) -> number"]
doc = "Arithmetic mean of the numeric values in the group."

[[functions]]
name = "count"
signatures = ["count(*) -> number", "count(expression any) -> number"]
doc = "Number of items (or non-NULL, non-MISSING values) in the group."

[[functions]]
name = "countn"
