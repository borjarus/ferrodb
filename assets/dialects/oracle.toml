doc = "UTC time of a timestamp with time zone."

[[functions]]
name = "sysdate"
signatures = ["sysdate() -> date"]
doc = "Current date and time of the database server (written without parentheses)."

[[functions]]
name = "systimestamp"
signatures = ["systimestamp() -> timestamp with time zone"]
doc = "Current server timestamp with time zone (written without parentheses)."

[[functions]]
