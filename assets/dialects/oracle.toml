# Oracle Database 19c / 21c / 23ai SQL and PL/SQL (functions marked 21c+/23ai need that
# release).
id = "oracle"
name = "Oracle SQL"
inherits = "sql"
identifier_quote = '"'
case_folding = "upper"
parser = ""

keywords = [
  "access", "add", "audit", "char", "cluster", "comment", "compress", "connect", "current",
  "date", "decimal", "exclusive", "file", "float", "identified", "immediate", "increment",
  "index", "initial", "integer", "level", "lock", "long", "maxextents", "minus", "mlslabel",
  "mode", "modify", "noaudit", "nocompress", "nowait", "number", "of", "offline", "online",
  "option", "pctfree", "prior", "public", "raw", "rename", "resource", "revoke", "row", "rowid",
  "rownum", "rows", "session", "share", "size", "smallint", "start", "successful", "synonym",
  "sysdate", "trigger", "uid", "user", "validate", "varchar", "varchar2", "view", "whenever",
]

soft_keywords = [
  "accessible", "always", "analyze", "apply", "authid", "autonomous_transaction", "bitmap",
  "body", "bulk", "byte", "cache", "close", "collect", "columns", "complete", "compound",
  "connect_by_iscycle", "connect_by_isleaf", "connect_by_root", "constant", "constructor",
  "continue", "cube", "currval", "cursor", "cycle", "day", "declare", "default_collation",
  "definer", "deterministic", "directory", "disable", "editionable", "editioning", "elsif",
  "enable", "errors", "exception", "exception_init", "exceptions", "execute", "exit", "external",
  "fast", "final", "flashback", "force", "forall", "generated", "global", "goto", "hash", "heap",
  "hour", "identity", "ignore", "indices", "instantiable", "instead", "interval", "invisible",
  "isolation", "json", "keep", "language", "lateral", "library", "list", "local", "locked", "log",
  "logging", "loop", "matched", "maxvalue", "member", "merge", "minute", "minvalue", "model",
  "month", "nested", "new", "next", "nextval", "nocache", "nocopy", "nocycle", "noforce",
  "noneditionable", "nologging", "nomaxvalue", "nominvalue", "noorder", "noparallel",
  "novalidate", "object", "old", "open", "organization", "others", "out", "overflow",
  "overriding", "package", "parallel", "parallel_enable", "parent", "percent", "pipe",
  "pipelined", "pivot", "pragma", "precedes", "preserve", "purge", "raise", "read", "record",
  "ref", "referencing", "refresh", "rely", "respect", "result", "result_cache", "return",
  "returns", "reverse", "role", "rollup", "rowtype", "sample", "second", "seed", "self",
  "serially_reusable", "serializable", "sets", "sharing", "siblings", "skip", "static", "storage",
  "store", "subpartition", "subtype", "tablespace", "ties", "timezone_abbr", "timezone_hour",
  "timezone_minute", "timezone_region", "type", "under", "unlimited", "unpivot", "unusable",
  "using_nls_comp", "varray", "virtual", "visible", "wait", "while", "within", "write", "year",
  "zone",
]

types = [
  "bfile", "binary_double", "binary_float", "binary_integer", "blob", "clob", "dec",
  "interval day to second", "interval year to month", "json", "long", "long raw", "natural",
  "naturaln", "nchar", "nclob", "number", "nvarchar2", "pls_integer", "positive", "positiven",
  "raw", "rowid", "sdo_geometry", "signtype", "simple_integer", "sys_refcursor",
  "timestamp with local time zone", "timestamp with time zone", "urowid", "varchar2", "vector",
  "xmltype",
]

removed_keywords = [
  "current_time",
]

removed_types = [
  "bigint", "time",
]

[[functions]]
name = "acos"
signatures = ["acos(n number) -> number"]
doc = "Arccosine of `n`, in radians."

[[functions]]
name = "asin"
signatures = ["asin(n number) -> number"]
doc = "Arcsine of `n`, in radians."

[[functions]]
name = "atan"
signatures = ["atan(n number) -> number"]
doc = "Arctangent of `n`, in radians."

[[functions]]
name = "atan2"
signatures = ["atan2(n1 number, n2 number) -> number"]
doc = "Arctangent of `n1/n2`, in radians."

[[functions]]
name = "bitand"
signatures = ["bitand(expr1 number, expr2 number) -> number"]
doc = "Bitwise AND of two integers."

[[functions]]
name = "ceil"
signatures = ["ceil(n number) -> number"]
doc = "Smallest integer greater than or equal to `n`."

[[functions]]
name = "cos"
signatures = ["cos(n number) -> number"]
doc = "Cosine of an angle in radians."

[[functions]]
name = "cosh"
signatures = ["cosh(n number) -> number"]
doc = "Hyperbolic cosine."

[[functions]]
name = "exp"
signatures = ["exp(n number) -> number"]
doc = "e raised to the power `n`."

[[functions]]
name = "floor"
signatures = ["floor(n number) -> number"]
doc = "Largest integer less than or equal to `n`."

[[functions]]
name = "ln"
signatures = ["ln(n number) -> number"]
doc = "Natural logarithm."

[[functions]]
name = "log"
signatures = ["log(n2 number, n1 number) -> number"]
doc = "Logarithm of `n1` in base `n2`."

[[functions]]
name = "mod"
signatures = ["mod(n2 number, n1 number) -> number"]
doc = "Remainder of `n2` divided by `n1` (sign of `n2`, uses FLOOR)."

[[functions]]
name = "nanvl"
signatures = ["nanvl(n2 number, n1 number) -> number"]
doc = "`n1` when `n2` is NaN (binary float/double), otherwise `n2`."

[[functions]]
name = "power"
signatures = ["power(n2 number, n1 number) -> number"]
doc = "`n2` raised to the power `n1`."

[[functions]]
name = "remainder"
signatures = ["remainder(n2 number, n1 number) -> number"]
doc = "Remainder of `n2` divided by `n1` (uses ROUND)."

[[functions]]
name = "round"
signatures = ["round(n number) -> number", "round(n number, integer number) -> number", "round(date date) -> date", "round(date date, fmt varchar2) -> date"]
doc = "Number rounded to `integer` places, or date rounded to the unit of `fmt`."

[[functions]]
name = "sign"
signatures = ["sign(n number) -> number"]
doc = "-1, 0 or 1 according to the sign of `n`."

[[functions]]
name = "sin"
signatures = ["sin(n number) -> number"]
doc = "Sine of an angle in radians."

[[functions]]
name = "sinh"
signatures = ["sinh(n number) -> number"]
doc = "Hyperbolic sine."

[[functions]]
name = "sqrt"
signatures = ["sqrt(n number) -> number"]
doc = "Square root."

[[functions]]
name = "tan"
signatures = ["tan(n number) -> number"]
doc = "Tangent of an angle in radians."

[[functions]]
name = "tanh"
signatures = ["tanh(n number) -> number"]
doc = "Hyperbolic tangent."

[[functions]]
name = "trunc"
signatures = ["trunc(n number) -> number", "trunc(n number, integer number) -> number", "trunc(date date) -> date", "trunc(date date, fmt varchar2) -> date"]
doc = "Number truncated to `integer` places, or date truncated to the unit of `fmt` (day by default)."

[[functions]]
name = "width_bucket"
signatures = ["width_bucket(expr number, min_value number, max_value number, num_buckets number) -> number"]
doc = "Bucket number of `expr` in an equi-width histogram."

[[functions]]
name = "ascii"
signatures = ["ascii(char varchar2) -> number"]
doc = "Code of the first character in the database character set."

[[functions]]
name = "chr"
signatures = ["chr(n number) -> varchar2"]
doc = "Character with the given code."

[[functions]]
name = "concat"
signatures = ["concat(char1 varchar2, char2 varchar2) -> varchar2"]
doc = "`char1` concatenated with `char2` (same as `||`)."

[[functions]]
name = "initcap"
signatures = ["initcap(char varchar2) -> varchar2"]
doc = "First letter of each word in upper case, the rest lower case."

[[functions]]
name = "instr"
signatures = ["instr(string varchar2, substring varchar2) -> number", "instr(string varchar2, substring varchar2, position number) -> number", "instr(string varchar2, substring varchar2, position number, occurrence number) -> number"]
doc = "Position of the n-th occurrence of a substring (0 when absent; negative `position` searches backwards)."

[[functions]]
name = "instrb"
signatures = ["instrb(string varchar2, substring varchar2) -> number", "instrb(string varchar2, substring varchar2, position number, occurrence number) -> number"]
doc = "Like `instr`, counting bytes."

[[functions]]
name = "length"
signatures = ["length(char varchar2) -> number"]
doc = "Number of characters (NULL for an empty string)."

[[functions]]
name = "lengthb"
signatures = ["lengthb(char varchar2) -> number"]
doc = "Length in bytes."

[[functions]]
name = "lengthc"
signatures = ["lengthc(char varchar2) -> number"]
doc = "Length in Unicode complete characters."

[[functions]]
name = "lpad"
signatures = ["lpad(expr1 varchar2, n number) -> varchar2", "lpad(expr1 varchar2, n number, expr2 varchar2) -> varchar2"]
doc = "`expr1` left-padded to length `n` with `expr2` (spaces by default)."

[[functions]]
name = "ltrim"
signatures = ["ltrim(char varchar2) -> varchar2", "ltrim(char varchar2, set varchar2) -> varchar2"]
doc = "Removes leading characters found in `set` (spaces by default)."

[[functions]]
name = "nchr"
signatures = ["nchr(n number) -> nvarchar2"]
doc = "National character with the given code."

[[functions]]
name = "nls_initcap"
signatures = ["nls_initcap(char varchar2) -> varchar2", "nls_initcap(char varchar2, nlsparam varchar2) -> varchar2"]
doc = "`initcap` with a linguistic sort (`'NLS_SORT = XDutch'`)."

[[functions]]
name = "nls_lower"
signatures = ["nls_lower(char varchar2) -> varchar2", "nls_lower(char varchar2, nlsparam varchar2) -> varchar2"]
doc = "`lower` with a linguistic sort."

[[functions]]
name = "nls_upper"
signatures = ["nls_upper(char varchar2) -> varchar2", "nls_upper(char varchar2, nlsparam varchar2) -> varchar2"]
doc = "`upper` with a linguistic sort."

[[functions]]
name = "nlssort"
signatures = ["nlssort(char varchar2) -> raw", "nlssort(char varchar2, nlsparam varchar2) -> raw"]
doc = "Collation key used to sort or compare linguistically."

[[functions]]
name = "regexp_count"
signatures = ["regexp_count(source_char varchar2, pattern varchar2) -> number", "regexp_count(source_char varchar2, pattern varchar2, position number) -> number", "regexp_count(source_char varchar2, pattern varchar2, position number, match_param varchar2) -> number"]
doc = "Number of regular-expression matches."

[[functions]]
name = "regexp_instr"
signatures = ["regexp_instr(source_char varchar2, pattern varchar2) -> number", "regexp_instr(source_char varchar2, pattern varchar2, position number) -> number", "regexp_instr(source_char varchar2, pattern varchar2, position number, occurrence number) -> number", "regexp_instr(source_char varchar2, pattern varchar2, position number, occurrence number, return_opt number, match_param varchar2, subexpr number) -> number"]
doc = "Position of a regular-expression match."

[[functions]]
name = "regexp_like"
signatures = ["regexp_like(source_char varchar2, pattern varchar2) -> boolean", "regexp_like(source_char varchar2, pattern varchar2, match_param varchar2) -> boolean"]
doc = "Condition: true when the string matches the regular expression."

[[functions]]
name = "regexp_replace"
signatures = ["regexp_replace(source_char varchar2, pattern varchar2) -> varchar2", "regexp_replace(source_char varchar2, pattern varchar2, replace_string varchar2) -> varchar2", "regexp_replace(source_char varchar2, pattern varchar2, replace_string varchar2, position number) -> varchar2", "regexp_replace(source_char varchar2, pattern varchar2, replace_string varchar2, position number, occurrence number, match_param varchar2) -> varchar2"]
doc = "Replaces regular-expression matches (`\\1` back-references allowed)."

[[functions]]
name = "regexp_substr"
signatures = ["regexp_substr(source_char varchar2, pattern varchar2) -> varchar2", "regexp_substr(source_char varchar2, pattern varchar2, position number) -> varchar2", "regexp_substr(source_char varchar2, pattern varchar2, position number, occurrence number) -> varchar2", "regexp_substr(source_char varchar2, pattern varchar2, position number, occurrence number, match_param varchar2, subexpr number) -> varchar2"]
doc = "Substring matching a regular expression."

[[functions]]
name = "replace"
signatures = ["replace(char varchar2, search_string varchar2) -> varchar2", "replace(char varchar2, search_string varchar2, replacement_string varchar2) -> varchar2"]
doc = "Replaces every occurrence of `search_string` (removes it when no replacement is given)."

[[functions]]
name = "rpad"
signatures = ["rpad(expr1 varchar2, n number) -> varchar2", "rpad(expr1 varchar2, n number, expr2 varchar2) -> varchar2"]
doc = "`expr1` right-padded to length `n` with `expr2` (spaces by default)."

[[functions]]
name = "rtrim"
signatures = ["rtrim(char varchar2) -> varchar2", "rtrim(char varchar2, set varchar2) -> varchar2"]
doc = "Removes trailing characters found in `set` (spaces by default)."

[[functions]]
name = "soundex"
signatures = ["soundex(char varchar2) -> varchar2"]
doc = "Phonetic representation of a string."

[[functions]]
name = "substr"
signatures = ["substr(char varchar2, position number) -> varchar2", "substr(char varchar2, position number, substring_length number) -> varchar2"]
doc = "Substring from `position` (negative counts from the end)."

[[functions]]
name = "substrb"
signatures = ["substrb(char varchar2, position number) -> varchar2", "substrb(char varchar2, position number, substring_length number) -> varchar2"]
doc = "Like `substr`, counting bytes."

[[functions]]
name = "translate"
signatures = ["translate(expr varchar2, from_string varchar2, to_string varchar2) -> varchar2"]
doc = "Replaces each character of `from_string` with the matching one of `to_string`."

[[functions]]
name = "trim"
signatures = ["trim(trim_source varchar2) -> varchar2"]
doc = "Removes spaces; `TRIM([LEADING|TRAILING|BOTH] c FROM s)` removes the character `c`."

[[functions]]
name = "add_months"
signatures = ["add_months(date date, integer number) -> date"]
doc = "Date plus a number of months (end of month preserved)."

[[functions]]
name = "dbtimezone"
signatures = ["dbtimezone() -> varchar2"]
