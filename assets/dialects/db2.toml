# IBM Db2 for Linux, UNIX and Windows (Db2 LUW) 11.5 / 12.1.
# Db2 lets most SQL words be identifiers; only the words that really break statements are reserved.
id = "db2"
name = "IBM Db2"
inherits = "sql"
identifier_quote = '"'
case_folding = "upper"
parser = ""

keywords = [
  "call", "current", "current_path", "current_schema", "current_server", "current_timezone",
  "cursor", "declare", "execute", "lateral", "merge", "session_user", "system_user", "user",
]

soft_keywords = [
  "activate", "alias", "always", "append", "atomic", "bufferpool", "business_time", "cache",
  "called", "cardinality", "close", "compress", "concurrent", "condition", "connect", "cs",
  "cube", "cycle", "dbinfo", "deferred", "describe", "deterministic", "distribution", "external",
  "fenced", "generated", "handler", "hash", "history", "ignore", "immediate", "implicitly",
  "include", "increment", "inout", "isolation", "iterate", "language", "leave", "lock",
  "locksize", "logged", "loop", "maintained", "maxvalue", "minus", "minvalue", "mode", "modifies",
  "next", "nextval", "nickname", "nocache", "nocycle", "noorder", "open", "optimization",
  "organize", "package", "parameter", "partitioning", "period", "prepare", "prevval", "query",
  "reads", "refresh", "release", "repeat", "resignal", "restart", "result", "return", "returns",
  "revoke", "role", "rollup", "rr", "rs", "sets", "share", "signal", "specific", "sql",
  "sqlstate", "start", "statement", "stogroup", "storage", "style", "system_time", "tablespace",
  "until", "ur", "value", "versioning", "volatile", "while",
]

types = [
  "binary", "binary large object", "binary varying", "blob", "char for bit data",
  "character large object", "character varying", "clob", "dbclob", "dec", "decfloat", "double",
  "graphic", "long varchar", "long vargraphic", "nchar", "nclob", "num", "nvarchar", "varbinary",
  "varchar for bit data", "vargraphic", "xml",
]

[[functions]]
name = "char"
signatures = ["char(value any) -> char", "char(value any, length integer) -> char", "char(value date, format_name varchar) -> char"]
doc = "Fixed-length character representation of a value (format `ISO`, `USA`, `EUR`, `JIS`, `LOCAL` for dates)."

[[functions]]
name = "varchar"
signatures = ["varchar(value any) -> varchar", "varchar(value any, length integer) -> varchar"]
doc = "Varying-length character representation of a value."

[[functions]]
name = "clob"
signatures = ["clob(value any) -> clob", "clob(value any, length integer) -> clob"]
doc = "CLOB representation of a character string."

[[functions]]
name = "blob"
signatures = ["blob(value any) -> blob", "blob(value any, length integer) -> blob"]
