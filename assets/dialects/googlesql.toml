# Google BigQuery, GoogleSQL dialect (2025-2026): reserved keywords and the commonly used
# built-in functions. Dotted families (`hll_count.*`, `keys.*`, `net.*`) are not listed.
id = "googlesql"
name = "GoogleSQL (BigQuery)"
inherits = "sql"
identifier_quote = '`'
# Dataset and table names are case-sensitive, column names are not: names keep their spelling.
case_folding = "none"
parser = "bigquery"

keywords = [
  "array", "assert_rows_modified", "at", "collate", "contains", "cube", "current", "define",
  "enum", "escape", "exclude", "extract", "following", "grouping", "groups", "hash", "if",
  "ignore", "interval", "lateral", "limit", "lookup", "merge", "new", "no", "nulls", "of",
  "over", "partition", "preceding", "proto", "qualify", "range", "recursive", "respect",
  "rollup", "rows", "struct", "tablesample", "treat", "unbounded", "unnest", "window",
  "within",
]

soft_keywords = [
  "access", "assert", "assignment", "break", "call", "capacity", "clone", "cluster",
  "column", "connection", "constraint", "continue", "copy", "declare", "deterministic",
  "elseif", "enforced", "exception", "execute", "export", "external", "files", "foreign",
  "format", "immediate", "iterate", "js", "language", "leave", "load", "loop", "matched",
  "model", "options", "overwrite", "pivot", "policy", "primary", "raise", "references",
  "repeat", "reservation", "return", "returns", "revoke", "search", "snapshot", "source",
  "system_time", "target", "undrop", "unpivot", "until", "uri", "vector", "while",
  "wildcard",
]

types = [
  "array", "bigdecimal", "bignumeric", "bool", "byteint", "bytes", "datetime", "float64",
  "geography", "int64", "interval", "json", "range", "string", "struct", "tinyint",
]

removed_keywords = [
  "both", "check", "column", "constraint", "current_user", "foreign", "leading", "primary",
  "references", "trailing", "unique",
]

removed_types = [
  "char", "character", "double precision", "float", "real", "varchar",
]

