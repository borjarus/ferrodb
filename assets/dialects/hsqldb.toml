# HyperSQL (HSQLDB) 2.7. Reserved words are the ones HyperSQL refuses as identifiers in its
# default mode (sql.enforce_names=false); the other SQL:2016 reserved words are soft keywords.
id = "hsqldb"
name = "HyperSQL"
inherits = "sql"
identifier_quote = '"'
case_folding = "upper"
default_schema = "PUBLIC"
parser = "generic"

keywords = [
  "at", "avg", "call", "coalesce", "convert", "corresponding", "count", "do", "every", "max",
  "min", "nullif", "stddev_pop", "stddev_samp", "sum", "trigger", "var_pop", "var_samp",
]

soft_keywords = [
  "absolute", "action", "admin", "always", "array", "asensitive", "asymmetric", "atomic",
  "authorization", "autocommit", "backup", "binary", "blob", "cached", "called", "cardinality",
  "cascaded", "checkpoint", "clob", "close", "collate", "collation", "condition", "connect",
  "continue", "cube", "current", "current_catalog", "current_path", "current_role",
  "current_schema", "cursor", "cycle", "deallocate", "declare", "defrag", "deterministic",
  "disconnect", "domain", "dynamic", "elseif", "external", "files", "generated", "get", "global",
  "grouping", "handler", "identity", "ignorecase", "immediate", "increment", "inout",
  "intersection", "interval", "isolation", "iterate", "language", "lateral", "leave", "level",
  "lob", "local", "localtime", "localtimestamp", "loop", "matched", "maxvalue", "memory", "merge",
  "method", "minus", "minvalue", "modifies", "module", "names", "new", "next", "nocycle", "old",
  "open", "out", "overlaps", "period", "position", "prepare", "property", "readonly", "reads",
  "referencing", "repeat", "resignal", "result", "return", "returns", "revoke", "rollup",
  "routine", "script", "scroll", "sensitive", "session", "session_user", "sets", "shutdown",
  "signal", "similar", "specific", "sql", "sqlexception", "sqlstate", "sqlwarning", "start",
  "static", "symmetric", "system_user", "text", "top", "undo", "unnest", "until", "user", "value",
  "varying", "while", "within", "write_delay",
]

types = [
  "array", "binary", "binary large object", "binary varying", "bit", "bit varying", "blob",
  "character large object", "character varying", "clob", "dec", "double", "interval",
  "longvarbinary", "longvarchar", "other", "time with time zone", "timestamp with time zone",
  "tinyint", "uuid", "varbinary", "varchar_ignorecase",
]

