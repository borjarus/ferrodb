[[functions]]
name = "with_max_staleness"
signatures = ["with_max_staleness(max_staleness interval) -> timestamptz", "with_max_staleness(max_staleness interval, nearest_only bool) -> timestamptz"]
doc = "Bounded-staleness read: data at most this stale (`AS OF SYSTEM TIME`)."

