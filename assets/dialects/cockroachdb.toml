# CockroachDB 24.x/25.x (distributed SQL, PostgreSQL wire-compatible): CockroachDB additions on
# top of the PostgreSQL dialect, minus the PostgreSQL types it does not implement.
id = "cockroachdb"
name = "CockroachDB"
inherits = "postgresql"
default_schema = "public"
parser = ""  # AS OF SYSTEM TIME, UPSERT… break the PostgreSQL parser

keywords = ["family", "index", "nothing"]

soft_keywords = [
  "backup", "bucket_count", "cancel", "changefeed", "configure", "covering", "experimental",
  "export", "families", "global", "hash", "import", "inject", "inverted", "invisible", "job",
  "jobs", "kv", "locality", "pause", "queries", "ranges", "region", "regional", "regions",
  "relocate", "restore", "resume", "scatter", "schedule", "schedules", "scrub", "sessions",
  "sharded", "split", "splits", "statistics", "stored", "storing", "survival", "survive",
  "system", "tenant", "trace", "unsplit", "upsert", "virtual", "visible", "zone", "zones",
]

types = [
  "box2d", "bytes", "geography", "geometry", "int2vector", "int64", "name", "oidvector",
  "pg_lsn", "refcursor", "regnamespace", "regproc", "regprocedure", "regrole", "regtype",
  "serial2", "serial4", "serial8", "string", "varbit", "vector",
]

removed_types = [
  "box", "cidr", "circle", "daterange", "int4range", "int8range", "line", "lseg", "macaddr",
  "money", "numrange", "path", "point", "polygon", "tsrange", "tstzrange", "xml",
]

[[functions]]
name = "unique_rowid"
signatures = ["unique_rowid() -> int"]
doc = "Unique 64-bit id from the insert timestamp and node id (default of `SERIAL`)."

[[functions]]
name = "unordered_unique_rowid"
signatures = ["unordered_unique_rowid() -> int"]
doc = "Unique 64-bit id with the bits reversed, spreading writes across ranges."

[[functions]]
name = "gen_random_ulid"
signatures = ["gen_random_ulid() -> uuid"]
doc = "Random ULID, returned as a UUID."

[[functions]]
name = "uuid_v4"
signatures = ["uuid_v4() -> bytes"]
doc = "Random version 4 UUID as 16 bytes."

[[functions]]
name = "uuid_generate_v4"
signatures = ["uuid_generate_v4() -> uuid"]
doc = "Random version 4 UUID (uuid-ossp compatible alias)."

[[functions]]
name = "to_uuid"
signatures = ["to_uuid(val string) -> bytes"]
doc = "Bytes of a UUID given as text."

[[functions]]
name = "from_uuid"
signatures = ["from_uuid(val bytes) -> string"]
