# Apache Hive 3.x / 4.x HiveQL (reserved words of Hive 3+, built-in UDF/UDAF/UDTF catalog).
id = "hiveql"
name = "HiveQL"
inherits = "sql"
identifier_quote = '`'
# Hive stores database, table and column names in lower case.
case_folding = "lower"
default_schema = "default"
parser = "hive"

keywords = [
  "array", "authorization", "bigint", "binary", "boolean", "cache", "char", "commit",
  "conf", "cube", "current", "cursor", "database", "date", "dayofweek", "decimal",
  "describe", "double", "exchange", "extended", "external", "extract", "float", "floor",
  "following", "function", "grouping", "if", "import", "int", "integer", "interval",
  "lateral", "less", "local", "macro", "map", "more", "none", "numeric", "of", "only",
  "out", "over", "partition", "percent", "preceding", "precision", "preserve", "procedure",
  "range", "reads", "reduce", "regexp", "revoke", "rlike", "rollback", "rollup", "row",
  "rows", "smallint", "start", "sync", "tablesample", "time", "timestamp", "transform",
  "trigger", "truncate", "unbounded", "uniquejoin", "user", "varchar", "views", "window",
]

soft_keywords = [
  "abort", "admin", "analyze", "archive", "avro", "buckets", "change", "cluster",
  "clustered", "collection", "columns", "compact", "compactions", "compute", "concatenate",
  "cost", "databases", "dbproperties", "defined", "directory", "disable", "distribute",
  "enable", "escaped", "explode", "export", "fields", "fileformat", "format", "formatted",
  "functions", "inputformat", "items", "jsonfile", "keys", "lines", "load", "location",
  "locks", "matched", "merge", "minus", "msck", "orc", "outputformat", "overwrite",
  "parquet", "partitioned", "partitions", "purge", "rcfile", "rebuild", "recover", "rely",
  "repair", "replication", "role", "roles", "schemas", "semi", "sequencefile", "serde",
  "serdeproperties", "show", "skewed", "sort", "sorted", "statistics", "stored", "tables",
  "tblproperties", "terminated", "textfile", "transactional", "transactions", "unarchive",
  "unset", "use",
]

types = [
  "array", "binary", "double", "interval", "map", "string", "struct",
  "timestamp with local time zone", "tinyint", "uniontype",
]

removed_keywords = [
  "any", "asc", "check", "current_time", "current_user", "default", "desc", "except",
  "leading", "natural", "some", "trailing", "unique",
]

