# Redis command catalog: Redis 7.x / 8.x core commands, RedisJSON and RediSearch basics.
# arity and keys follow COMMAND INFO (negative arity = at least |arity| arguments; keys =
# [first, last, step], 0,0,0 = no fixed key positions). Syntax excludes the command name.
# Module commands (JSON.*, FT.*): arity derived from the documented minimal syntax.

[[commands]]
name = "DEL"
group = "generic"
summary = "Deletes one or more keys."
arity = -2
flags = ["write"]
syntax = "key [key ...]"
keys = [1, -1, 1]
since = "1.0.0"

[[commands]]
name = "UNLINK"
group = "generic"
summary = "Asynchronously deletes one or more keys (memory is reclaimed in the background)."
arity = -2
flags = ["write", "fast"]
syntax = "key [key ...]"
keys = [1, -1, 1]
since = "4.0.0"

