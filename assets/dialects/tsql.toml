# Microsoft SQL Server 2022 / Azure SQL Database Transact-SQL (functions marked 2025 need
# SQL Server 2025 or Azure SQL).
id = "tsql"
name = "Transact-SQL"
inherits = "sql"
identifier_quote = '['
case_folding = "none"
default_schema = "dbo"
parser = "mssql"

keywords = [
  "add", "authorization", "backup", "begin", "break", "browse", "bulk", "cascade", "checkpoint",
  "close", "clustered", "coalesce", "collate", "commit", "compute", "contains", "containstable",
  "continue", "convert", "current", "cursor", "database", "dbcc", "deallocate", "declare", "deny",
  "disk", "distributed", "double", "dump", "errlvl", "escape", "exec", "execute", "exit",
  "external", "file", "fillfactor", "freetext", "freetexttable", "function", "goto", "holdlock",
  "identity", "identity_insert", "identitycol", "if", "index", "key", "kill", "lineno", "load",
  "merge", "national", "nocheck", "nonclustered", "nullif", "of", "off", "offsets", "open",
  "opendatasource", "openquery", "openrowset", "openxml", "option", "over", "percent", "pivot",
  "plan", "precision", "print", "proc", "procedure", "public", "raiserror", "read", "readtext",
  "reconfigure", "replication", "restore", "restrict", "return", "revert", "revoke", "rollback",
  "rowcount", "rowguidcol", "rule", "save", "schema", "securityaudit", "semantickeyphrasetable",
  "semanticsimilaritydetailstable", "semanticsimilaritytable", "session_user", "setuser",
  "shutdown", "statistics", "system_user", "tablesample", "textsize", "top", "tran",
  "transaction", "trigger", "truncate", "try_convert", "tsequal", "unpivot", "updatetext", "use",
  "user", "varying", "view", "waitfor", "while", "within", "writetext",
]

soft_keywords = [
  "absolute", "allow_page_locks", "allow_row_locks", "always", "ansi_nulls", "ansi_padding",
  "ansi_warnings", "apply", "arithabort", "assembly", "asymmetric", "at", "audit", "auto",
  "base64", "both", "bucket_count", "caller", "catalog", "catch", "certificate",
  "change_tracking", "columnstore", "committed", "compression", "concat_null_yields_null",
  "contained", "conversation", "copy_only", "credential", "cube", "data_compression",
  "data_source", "datefirst", "dateformat", "deadlock_priority", "delay", "delayed_durability",
  "deleted", "dialog", "differential", "disable", "drop_existing", "durability", "dynamic",
  "elements", "enable", "encryption", "endpoint", "event", "expand", "explicit",
  "external_access", "fast", "fast_forward", "filegroup", "filestream", "filetable", "fmtonly",
  "forceplan", "forcescan", "forceseek", "forward_only", "fulltext", "global", "go", "grouping",
  "hash", "hidden", "history_table", "ignore_dup_key", "implicit_transactions", "include",
  "include_null_values", "inline", "input", "inserted", "io", "isolation", "json", "keep",
  "keepfixed", "keyset", "language", "ledger", "leading", "level", "local", "lock_timeout",
  "login", "loop", "masked", "master", "matched", "max", "maxdop", "memory_optimized", "message",
  "move", "native_compilation", "next", "nocount", "noexpand", "noexec", "nolock", "none",
  "norecovery", "nowait", "numeric_roundabort", "online", "openjson", "optimistic", "optimize",
  "output", "owner", "pad_index", "page", "paglock", "parameterization", "parseonly", "path",
  "period", "permission_set", "persisted", "prior", "profile", "queue", "querytraceon",
  "quoted_identifier", "raw", "read_only", "readcommitted", "readcommittedlock", "readpast",
  "readuncommitted", "rebuild", "receive", "recompile", "recovery", "relative", "remote",
  "reorganize", "repeatable", "repeatableread", "resumable", "retention", "returns", "robust",
  "role", "rollup", "root", "rowlock", "safe", "schema_and_data", "schema_only", "schemabinding",
  "scroll", "scroll_locks", "self", "send", "serializable", "service", "sets", "showplan_all",
  "showplan_text", "showplan_xml", "simple", "snapshot", "sort_in_tempdb", "sparse", "spatial",
  "standby", "start", "static", "statistics_norecompute", "stats", "stoplist", "symmetric",
  "synonym", "system_time", "system_versioning", "tablock", "tablockx", "throw", "ties", "time",
  "timeout", "trailing", "try", "type", "type_warning", "uncommitted", "unknown", "unsafe",
  "updlock", "view_metadata", "views", "without_array_wrapper", "xact_abort", "xlock", "xmldata",
  "xmlschema", "zone",
]

types = [
  "binary", "bit", "cursor", "datetime", "datetime2", "datetimeoffset", "dec", "geography",
  "geometry", "hierarchyid", "image", "json", "money", "nchar", "ntext", "nvarchar", "rowversion",
  "smalldatetime", "smallmoney", "sql_variant", "sysname", "table", "text", "tinyint",
  "uniqueidentifier", "varbinary", "vector", "xml",
]

removed_keywords = [
  "both", "false", "leading", "natural", "trailing", "true",
]

removed_types = [
  "boolean",
]

[[functions]]
name = "ascii"
signatures = ["ascii(character_expression varchar) -> int"]
doc = "ASCII code of the leftmost character."

[[functions]]
name = "char"
signatures = ["char(integer_expression int) -> char"]
doc = "Single-byte character with the given code."

[[functions]]
name = "charindex"
signatures = ["charindex(expression_to_find nvarchar, expression_to_search nvarchar) -> int", "charindex(expression_to_find nvarchar, expression_to_search nvarchar, start_location int) -> int"]
doc = "1-based position of a substring (0 when not found)."

[[functions]]
name = "concat"
signatures = ["concat(string_value1 any, string_value2 any, ...) -> nvarchar"]
doc = "Concatenates values (NULL treated as empty string)."

[[functions]]
name = "concat_ws"
signatures = ["concat_ws(separator nvarchar, argument1 any, argument2 any, ...) -> nvarchar"]
doc = "Concatenates values with a separator, skipping NULLs."

[[functions]]
name = "datalength"
signatures = ["datalength(expression any) -> int"]
doc = "Number of bytes used to represent the value."

[[functions]]
name = "difference"
signatures = ["difference(character_expression1 varchar, character_expression2 varchar) -> int"]
doc = "Similarity (0-4) of the SOUNDEX codes of two strings."

[[functions]]
name = "format"
signatures = ["format(value any, format nvarchar) -> nvarchar", "format(value any, format nvarchar, culture nvarchar) -> nvarchar"]
doc = "Formats a value with a .NET format string and optional culture."

[[functions]]
name = "left"
signatures = ["left(character_expression nvarchar, integer_expression int) -> nvarchar"]
doc = "Leftmost `n` characters."

[[functions]]
name = "len"
signatures = ["len(string_expression nvarchar) -> int"]
doc = "Number of characters (trailing spaces excluded)."

[[functions]]
name = "ltrim"
signatures = ["ltrim(character_expression nvarchar) -> nvarchar", "ltrim(character_expression nvarchar, characters nvarchar) -> nvarchar"]
doc = "Removes leading spaces (or the given characters, 2022+)."

[[functions]]
name = "nchar"
signatures = ["nchar(integer_expression int) -> nchar"]
doc = "Unicode character with the given code point."

[[functions]]
name = "patindex"
signatures = ["patindex(pattern nvarchar, expression nvarchar) -> int"]
doc = "1-based position of the first match of a `LIKE` pattern (`'%x%'`)."

[[functions]]
name = "quotename"
signatures = ["quotename(character_string sysname) -> nvarchar", "quotename(character_string sysname, quote_character char) -> nvarchar"]
doc = "String delimited as a valid identifier (`[name]`)."

[[functions]]
name = "replicate"
signatures = ["replicate(string_expression nvarchar, integer_expression int) -> nvarchar"]
doc = "String repeated `n` times."

[[functions]]
name = "reverse"
signatures = ["reverse(string_expression nvarchar) -> nvarchar"]
doc = "String with the characters in reverse order."

[[functions]]
name = "right"
signatures = ["right(character_expression nvarchar, integer_expression int) -> nvarchar"]
doc = "Rightmost `n` characters."

[[functions]]
name = "rtrim"
signatures = ["rtrim(character_expression nvarchar) -> nvarchar", "rtrim(character_expression nvarchar, characters nvarchar) -> nvarchar"]
doc = "Removes trailing spaces (or the given characters, 2022+)."

[[functions]]
name = "soundex"
signatures = ["soundex(character_expression varchar) -> varchar"]
doc = "Four-character SOUNDEX code of a string."

[[functions]]
name = "space"
signatures = ["space(integer_expression int) -> varchar"]
doc = "String of `n` spaces."

[[functions]]
name = "str"
signatures = ["str(float_expression float) -> varchar", "str(float_expression float, length int) -> varchar", "str(float_expression float, length int, decimal int) -> varchar"]
doc = "Number converted to right-aligned text."

[[functions]]
name = "string_escape"
signatures = ["string_escape(text nvarchar, type nvarchar) -> nvarchar"]
doc = "Escapes special characters (`type` is `'json'`)."

[[functions]]
name = "string_split"
signatures = ["string_split(string nvarchar, separator nvarchar) -> table", "string_split(string nvarchar, separator nvarchar, enable_ordinal int) -> table"]
doc = "Table-valued: splits a string into rows (`value`, optional `ordinal`)."

[[functions]]
name = "stuff"
signatures = ["stuff(character_expression nvarchar, start int, length int, replace_with_expression nvarchar) -> nvarchar"]
doc = "Deletes `length` characters at `start` and inserts another string there."

[[functions]]
name = "substring"
signatures = ["substring(expression nvarchar, start int, length int) -> nvarchar"]
doc = "Part of a string, binary, text or image value."

[[functions]]
name = "translate"
signatures = ["translate(input_string nvarchar, characters nvarchar, translations nvarchar) -> nvarchar"]
doc = "Replaces each character of `characters` with the matching one of `translations`."

[[functions]]
name = "trim"
signatures = ["trim(string nvarchar) -> nvarchar"]
doc = "Removes leading and trailing spaces; `TRIM([LEADING|TRAILING|BOTH] chars FROM s)` removes given characters."

[[functions]]
name = "unicode"
signatures = ["unicode(ncharacter_expression nvarchar) -> int"]
doc = "Unicode code point of the first character."

[[functions]]
name = "unistr"
signatures = ["unistr(character_expression nvarchar) -> nvarchar", "unistr(character_expression nvarchar, unicode_escape_character nchar) -> nvarchar"]
doc = "Interprets Unicode escapes (`\\0041`) in a string (2025, Azure SQL)."

[[functions]]
name = "regexp_like"
signatures = ["regexp_like(string_expression nvarchar, pattern_expression nvarchar) -> bit", "regexp_like(string_expression nvarchar, pattern_expression nvarchar, flags varchar) -> bit"]
doc = "True when the string matches a regular expression (2025, Azure SQL)."

[[functions]]
name = "regexp_replace"
signatures = ["regexp_replace(string_expression nvarchar, pattern_expression nvarchar) -> nvarchar", "regexp_replace(string_expression nvarchar, pattern_expression nvarchar, string_replacement nvarchar) -> nvarchar", "regexp_replace(string_expression nvarchar, pattern_expression nvarchar, string_replacement nvarchar, start int, occurrence int, flags varchar) -> nvarchar"]
doc = "Replaces regular-expression matches (2025, Azure SQL)."

[[functions]]
name = "regexp_substr"
signatures = ["regexp_substr(string_expression nvarchar, pattern_expression nvarchar) -> nvarchar", "regexp_substr(string_expression nvarchar, pattern_expression nvarchar, start int, occurrence int, flags varchar, group int) -> nvarchar"]
doc = "Substring matching a regular expression (2025, Azure SQL)."

[[functions]]
name = "regexp_instr"
signatures = ["regexp_instr(string_expression nvarchar, pattern_expression nvarchar) -> int", "regexp_instr(string_expression nvarchar, pattern_expression nvarchar, start int, occurrence int, return_option int, flags varchar, group int) -> int"]
doc = "Position of a regular-expression match (2025, Azure SQL)."

[[functions]]
name = "regexp_count"
signatures = ["regexp_count(string_expression nvarchar, pattern_expression nvarchar) -> int", "regexp_count(string_expression nvarchar, pattern_expression nvarchar, start int, flags varchar) -> int"]
doc = "Number of regular-expression matches (2025, Azure SQL)."

[[functions]]
name = "base64_encode"
signatures = ["base64_encode(expression varbinary) -> varchar", "base64_encode(expression varbinary, url_safe bit) -> varchar"]
doc = "Base64 text of a binary value (2025, Azure SQL)."

[[functions]]
name = "base64_decode"
signatures = ["base64_decode(expression varchar) -> varbinary"]
doc = "Binary value decoded from Base64 text (2025, Azure SQL)."

[[functions]]
name = "getdate"
signatures = ["getdate() -> datetime"]
doc = "Current date and time of the server (`datetime`)."

[[functions]]
name = "getutcdate"
signatures = ["getutcdate() -> datetime"]
doc = "Current UTC date and time (`datetime`)."

[[functions]]
name = "sysdatetime"
signatures = ["sysdatetime() -> datetime2"]
doc = "Current date and time with `datetime2(7)` precision."

[[functions]]
name = "sysutcdatetime"
signatures = ["sysutcdatetime() -> datetime2"]
doc = "Current UTC date and time with `datetime2(7)` precision."

[[functions]]
name = "sysdatetimeoffset"
signatures = ["sysdatetimeoffset() -> datetimeoffset"]
doc = "Current date and time including the server time-zone offset."

[[functions]]
name = "current_timezone"
signatures = ["current_timezone() -> varchar"]
doc = "Name of the time zone of the server or instance."

[[functions]]
name = "current_timezone_id"
signatures = ["current_timezone_id() -> varchar"]
doc = "Windows time-zone ID of the server or instance."

[[functions]]
name = "dateadd"
signatures = ["dateadd(datepart keyword, number int, date datetime) -> datetime"]
doc = "Date with `number` date parts added (`dateadd(day, 1, d)`)."

[[functions]]
name = "datediff"
signatures = ["datediff(datepart keyword, startdate datetime, enddate datetime) -> int"]
doc = "Number of date-part boundaries crossed between two dates."

[[functions]]
name = "datediff_big"
signatures = ["datediff_big(datepart keyword, startdate datetime, enddate datetime) -> bigint"]
doc = "Like `datediff`, returning `bigint`."

[[functions]]
name = "datefromparts"
signatures = ["datefromparts(year int, month int, day int) -> date"]
doc = "`date` built from its parts."

[[functions]]
name = "datetime2fromparts"
signatures = ["datetime2fromparts(year int, month int, day int, hour int, minute int, seconds int, fractions int, precision int) -> datetime2"]
doc = "`datetime2` built from its parts."

[[functions]]
name = "datetimefromparts"
signatures = ["datetimefromparts(year int, month int, day int, hour int, minute int, seconds int, milliseconds int) -> datetime"]
doc = "`datetime` built from its parts."

[[functions]]
name = "datetimeoffsetfromparts"
signatures = ["datetimeoffsetfromparts(year int, month int, day int, hour int, minute int, seconds int, fractions int, hour_offset int, minute_offset int, precision int) -> datetimeoffset"]
doc = "`datetimeoffset` built from its parts."

[[functions]]
name = "smalldatetimefromparts"
signatures = ["smalldatetimefromparts(year int, month int, day int, hour int, minute int) -> smalldatetime"]
doc = "`smalldatetime` built from its parts."

[[functions]]
name = "timefromparts"
signatures = ["timefromparts(hour int, minute int, seconds int, fractions int, precision int) -> time"]
doc = "`time` built from its parts."

[[functions]]
name = "datename"
signatures = ["datename(datepart keyword, date datetime) -> nvarchar"]
doc = "Name of a date part as text (`datename(month, d)`)."

[[functions]]
name = "datepart"
signatures = ["datepart(datepart keyword, date datetime) -> int"]
doc = "Integer value of a date part."

[[functions]]
name = "datetrunc"
signatures = ["datetrunc(datepart keyword, date datetime2) -> datetime2"]
doc = "Date truncated to the given part (2022+)."

[[functions]]
name = "date_bucket"
signatures = ["date_bucket(datepart keyword, number int, date datetime2) -> datetime2", "date_bucket(datepart keyword, number int, date datetime2, origin datetime2) -> datetime2"]
doc = "Start of the fixed-width bucket containing the date (2022+)."

[[functions]]
name = "day"
signatures = ["day(date datetime) -> int"]
doc = "Day of the month."

[[functions]]
name = "month"
signatures = ["month(date datetime) -> int"]
doc = "Month number."

[[functions]]
name = "year"
signatures = ["year(date datetime) -> int"]
doc = "Year."

[[functions]]
name = "eomonth"
signatures = ["eomonth(start_date date) -> date", "eomonth(start_date date, month_to_add int) -> date"]
doc = "Last day of the month (optionally `month_to_add` months later)."

[[functions]]
name = "isdate"
signatures = ["isdate(expression varchar) -> int"]
doc = "1 when the expression is a valid `datetime` value."

[[functions]]
name = "switchoffset"
signatures = ["switchoffset(datetimeoffset_expression datetimeoffset, timezoneoffset_expression varchar) -> datetimeoffset"]
doc = "Same instant expressed in another time-zone offset."

[[functions]]
name = "todatetimeoffset"
signatures = ["todatetimeoffset(datetime_expression datetime2, timezoneoffset_expression varchar) -> datetimeoffset"]
doc = "Date/time combined with a time-zone offset."

[[functions]]
name = "generate_series"
signatures = ["generate_series(start int, stop int) -> table", "generate_series(start int, stop int, step int) -> table"]
doc = "Table-valued: series of numbers in column `value` (2022+)."

[[functions]]
name = "acos"
signatures = ["acos(float_expression float) -> float"]
doc = "Arccosine, in radians."

[[functions]]
name = "asin"
signatures = ["asin(float_expression float) -> float"]
doc = "Arcsine, in radians."

[[functions]]
name = "atan"
signatures = ["atan(float_expression float) -> float"]
doc = "Arctangent, in radians."

[[functions]]
name = "atn2"
signatures = ["atn2(float_expression float, float_expression2 float) -> float"]
doc = "Angle in radians between the x-axis and the point (`y`, `x`)."

[[functions]]
name = "ceiling"
signatures = ["ceiling(numeric_expression numeric) -> numeric"]
doc = "Smallest integer greater than or equal to the value."

[[functions]]
name = "cos"
signatures = ["cos(float_expression float) -> float"]
doc = "Cosine of an angle in radians."

[[functions]]
name = "cot"
signatures = ["cot(float_expression float) -> float"]
doc = "Cotangent of an angle in radians."

[[functions]]
name = "degrees"
signatures = ["degrees(numeric_expression numeric) -> numeric"]
doc = "Radians converted to degrees."

[[functions]]
name = "exp"
signatures = ["exp(float_expression float) -> float"]
doc = "e raised to the given power."

[[functions]]
name = "floor"
signatures = ["floor(numeric_expression numeric) -> numeric"]
doc = "Largest integer less than or equal to the value."

[[functions]]
name = "log"
signatures = ["log(float_expression float) -> float", "log(float_expression float, base float) -> float"]
doc = "Natural logarithm, or logarithm in the given base."

[[functions]]
name = "log10"
signatures = ["log10(float_expression float) -> float"]
doc = "Base-10 logarithm."

[[functions]]
name = "pi"
signatures = ["pi() -> float"]
doc = "The constant pi."

[[functions]]
name = "power"
signatures = ["power(float_expression float, y float) -> float"]
doc = "Value raised to the power `y`."

[[functions]]
name = "radians"
signatures = ["radians(numeric_expression numeric) -> numeric"]
doc = "Degrees converted to radians."

[[functions]]
name = "rand"
signatures = ["rand() -> float", "rand(seed int) -> float"]
doc = "Pseudo-random float between 0 and 1."

[[functions]]
name = "round"
signatures = ["round(numeric_expression numeric, length int) -> numeric", "round(numeric_expression numeric, length int, function int) -> numeric"]
doc = "Rounds (or truncates when `function` <> 0) to `length` decimal places."

[[functions]]
name = "sign"
signatures = ["sign(numeric_expression numeric) -> int"]
doc = "-1, 0 or 1 according to the sign."

[[functions]]
name = "sin"
signatures = ["sin(float_expression float) -> float"]
doc = "Sine of an angle in radians."

[[functions]]
name = "sqrt"
signatures = ["sqrt(float_expression float) -> float"]
doc = "Square root."

[[functions]]
name = "square"
signatures = ["square(float_expression float) -> float"]
doc = "Square of the value."

[[functions]]
name = "tan"
signatures = ["tan(float_expression float) -> float"]
doc = "Tangent of an angle in radians."

[[functions]]
name = "greatest"
signatures = ["greatest(expression1 any, ...) -> any"]
doc = "Largest value of the list (2022+)."

[[functions]]
name = "least"
signatures = ["least(expression1 any, ...) -> any"]
doc = "Smallest value of the list (2022+)."

[[functions]]
name = "left_shift"
signatures = ["left_shift(expression_value bigint, shift_amount int) -> bigint"]
