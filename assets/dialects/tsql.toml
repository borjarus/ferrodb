doc = "Value with the bit at the given offset set (2022+)."

[[functions]]
name = "convert"
signatures = ["convert(data_type type, expression any) -> any", "convert(data_type type, expression any, style int) -> any"]
doc = "Converts to a data type, with an optional style code."

[[functions]]
name = "parse"
signatures = ["parse(string_value nvarchar, data_type type) -> any"]
doc = "`PARSE(string AS type [USING culture])`: converts text to a date/time or number type."

[[functions]]
name = "try_cast"
signatures = ["try_cast(expression any, data_type type) -> any"]
doc = "`TRY_CAST(expr AS type)`: cast that returns NULL on failure."

[[functions]]
name = "try_convert"
signatures = ["try_convert(data_type type, expression any) -> any", "try_convert(data_type type, expression any, style int) -> any"]
doc = "`convert` that returns NULL on failure."

[[functions]]
name = "try_parse"
signatures = ["try_parse(string_value nvarchar, data_type type) -> any"]
doc = "`TRY_PARSE(string AS type [USING culture])`: `parse` that returns NULL on failure."

[[functions]]
name = "choose"
signatures = ["choose(index int, val_1 any, val_2 any, ...) -> any"]
doc = "Item at the given 1-based index of the list."

[[functions]]
name = "iif"
signatures = ["iif(boolean_expression bit, true_value any, false_value any) -> any"]
doc = "`true_value` when the condition holds, otherwise `false_value`."

[[functions]]
name = "isnull"
signatures = ["isnull(check_expression any, replacement_value any) -> any"]
doc = "`replacement_value` when the first argument is NULL."

[[functions]]
name = "isjson"
signatures = ["isjson(expression nvarchar) -> int", "isjson(expression nvarchar, json_type_constraint keyword) -> int"]
doc = "1 when the string is valid JSON (optionally of type VALUE/ARRAY/OBJECT/SCALAR)."

[[functions]]
name = "json_value"
signatures = ["json_value(expression nvarchar, path nvarchar) -> nvarchar"]
doc = "Scalar value extracted from JSON (`'$.a.b'`)."

[[functions]]
name = "json_query"
signatures = ["json_query(expression nvarchar) -> nvarchar", "json_query(expression nvarchar, path nvarchar) -> nvarchar"]
doc = "Object or array extracted from JSON."

[[functions]]
name = "json_modify"
signatures = ["json_modify(expression nvarchar, path nvarchar, newValue any) -> nvarchar"]
doc = "JSON with the value at the path updated."

[[functions]]
name = "json_object"
signatures = ["json_object(key_value any, ...) -> nvarchar"]
doc = "JSON object from `'key':value` pairs (2022+)."

[[functions]]
name = "json_array"
signatures = ["json_array(value any, ...) -> nvarchar"]
doc = "JSON array from the values (2022+)."

[[functions]]
name = "json_path_exists"
signatures = ["json_path_exists(value_expression nvarchar, sql_json_path nvarchar) -> bit"]
doc = "1 when the JSON path exists in the input (2022+)."

[[functions]]
name = "json_objectagg"
signatures = ["json_objectagg(key_value any) -> nvarchar"]
doc = "Aggregate: JSON object from `key:value` pairs of the rows (2025, Azure SQL)."

[[functions]]
name = "json_arrayagg"
signatures = ["json_arrayagg(value_expression any) -> nvarchar"]
doc = "Aggregate: JSON array of the row values (2025, Azure SQL)."

[[functions]]
name = "openjson"
signatures = ["openjson(jsonExpression nvarchar) -> table", "openjson(jsonExpression nvarchar, path nvarchar) -> table"]
doc = "Table-valued: rows from a JSON text (`WITH (...)` for typed columns)."

[[functions]]
name = "count"
signatures = ["count(expression any) -> int", "count(*) -> int"]
doc = "Number of rows / non-null values (`int`)."

[[functions]]
name = "count_big"
signatures = ["count_big(expression any) -> bigint", "count_big(*) -> bigint"]
