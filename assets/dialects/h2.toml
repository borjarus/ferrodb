# H2 Database Engine 2.x (2.2 / 2.3), regular mode (no compatibility mode).
id = "h2"
name = "H2"
inherits = "sql"
identifier_quote = '"'
case_folding = "upper"
default_schema = "PUBLIC"
parser = "generic"

keywords = [
  "_rowid_", "array", "asymmetric", "authorization", "current_catalog", "current_path",
  "current_role", "current_schema", "day", "groups", "hour", "if", "ilike", "interval", "key",
  "limit", "localtime", "localtimestamp", "minus", "minute", "month", "offset", "over",
  "partition", "qualify", "range", "regexp", "row", "rownum", "rows", "second", "session_user",
  "symmetric", "system_user", "top", "uescape", "unknown", "user", "value", "window", "year",
]

soft_keywords = [
  "action", "admin", "always", "analyze", "autocommit", "backup", "cache", "cached", "call",
  "checkpoint", "comment", "constant", "cycle", "deterministic", "domain", "exclusive",
  "generated", "identity", "ignorecase", "increment", "indexes", "isolation", "java", "link",
  "linked", "lock", "log", "maxvalue", "memory", "merge", "minvalue", "mode", "nocache",
  "nocycle", "nomaxvalue", "nominvalue", "noorder", "nopersistent", "password", "persistent",
  "policy", "referential_integrity", "restart", "role", "runscript", "script", "share",
  "shutdown", "start", "synonym", "system", "uuid", "version", "wait",
]

types = [
  "array", "binary", "binary large object", "binary varying", "blob", "bool",
  "character large object", "character varying", "clob", "dec", "decfloat", "double", "enum",
  "geometry", "interval day", "interval day to second", "interval hour", "interval minute",
  "interval month", "interval second", "interval year", "interval year to month", "java_object",
  "json", "row", "time with time zone", "timestamp with time zone", "tinyint", "uuid",
  "varbinary", "varchar_ignorecase",
]

