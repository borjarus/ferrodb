# ClickHouse 24.x / 25.x: clause keywords and the commonly used built-in functions.
# Function names keep their real (case-sensitive) camelCase spelling.
id = "clickhouse"
name = "ClickHouse"
inherits = "sql"
# ClickHouse accepts both "name" and `name`; backticks are the usual style.
identifier_quote = '`'
# Names are case-sensitive and stored as written.
case_folding = "none"
default_schema = "default"
parser = "clickhouse"

keywords = [
  "array", "final", "global", "ilike", "interval", "limit", "prewhere", "sample",
  "settings",
]

soft_keywords = [
  "alias", "anti", "apply", "asof", "attach", "cache", "cluster", "codec", "columns",
  "comment", "cube", "databases", "deduplicate", "delay", "describe", "detach",
  "dictionaries", "dictionary", "disk", "distributed", "engine", "events", "exchange",
  "fetches", "fill", "flush", "format", "freeze", "granularity", "grouping", "ignore",
  "interpolate", "kill", "live", "local", "logs", "mark", "materialize", "merges", "modify",
  "move", "mutation", "mutations", "optimize", "organize", "outfile", "paste",
  "permanently", "policy", "populate", "profile", "projection", "query", "quota", "refresh",
  "reload", "replicas", "role", "rollup", "semi", "sends", "sets", "show", "sorting",
  "stale", "step", "sync", "system", "tables", "tags", "totals", "ttl", "uncompressed",
  "unfreeze", "use", "user", "volume", "watch",
]

types = [
  "aggregatefunction", "array", "bfloat16", "bool", "date32", "datetime", "datetime64",
  "decimal128", "decimal256", "decimal32", "decimal64", "dynamic", "enum", "enum16",
  "enum8", "fixedstring", "float32", "float64", "int128", "int16", "int256", "int32",
  "int64", "int8", "interval", "ipv4", "ipv6", "json", "linestring", "lowcardinality",
  "map", "multilinestring", "multipolygon", "nested", "nullable", "point", "polygon",
  "ring", "simpleaggregatefunction", "string", "time64", "tuple", "uint128", "uint16",
  "uint256", "uint32", "uint64", "uint8", "uuid", "variant",
]

