[[functions]]
name = "months_between"
signatures = ["months_between(date1 date, date2 date) -> float8"]
doc = "Number of months between two dates (fractional)."

[[functions]]
name = "add_months"
signatures = ["add_months(value timestamp, num_months int) -> timestamp"]
doc = "Date/time plus a number of months."

[[functions]]
name = "last_day"
signatures = ["last_day(value date) -> date"]
doc = "Last day of the month of the date."

[[functions]]
name = "next_day"
signatures = ["next_day(value date, day varchar) -> date"]
doc = "First given weekday after the date."

[[functions]]
name = "convert_timezone"
signatures = ["convert_timezone(target_timezone varchar, value timestamp) -> timestamp", "convert_timezone(source_timezone varchar, target_timezone varchar, value timestamp) -> timestamp"]
doc = "Converts a timestamp between time zones."

[[functions]]
name = "trunc"
signatures = ["trunc(value timestamp) -> date", "trunc(number numeric) -> numeric", "trunc(number numeric, integer int) -> numeric"]
doc = "Truncates a timestamp to its date or a number to a precision."

