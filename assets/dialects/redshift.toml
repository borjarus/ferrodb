# Amazon Redshift (provisioned and serverless, 2025): derived from PostgreSQL 8.0, with the
# PostgreSQL types/functions it lacks removed and its own functions (SUPER, HLL, date math) added.
id = "redshift"
name = "Amazon Redshift"
inherits = "postgresql"
parser = "redshift"

keywords = [
  "aes128", "aes256", "allowoverwrite", "authorization", "az64", "backup", "binary",
  "blanksasnull", "bytedict", "bzip2", "credentials", "current_user_id", "deflate", "defrag",
  "delta", "delta32k", "disable", "emptyasnull", "enable", "encode", "encrypt", "encryption",
  "explicit", "globaldict256", "globaldict64k", "gzip", "identity", "ignore", "interval",
  "lun", "luns", "lzo", "lzop", "minus", "mostly16", "mostly32", "mostly8", "new", "nulls",
  "off", "offline", "oid", "old", "open", "parallel", "partition", "percent", "permissions",
  "pivot", "raw", "readratio", "recover", "rejectlog", "resort", "respect", "restore",
  "snapshot", "sysdate", "system", "tag", "tdes", "text255", "text32k", "timestamp", "top",
  "truncatecolumns", "unnest", "unpivot", "wallet", "without",
]

soft_keywords = [
  "approximate", "auto", "compound", "copy", "datashare", "distkey", "diststyle", "even",
  "external", "iam_role", "interleaved", "library", "manifest", "model", "qualify", "sortkey",
  "stl", "unload", "within",
]

types = [
  "binary varying", "bpchar", "geography", "geometry", "hllsketch", "nchar", "nvarchar",
  "super", "time with time zone", "time without time zone", "timestamp with time zone",
  "timestamp without time zone", "varbinary", "varbyte",
]

removed_keywords = [
  "asymmetric", "concurrently", "current_catalog", "current_role", "current_schema", "lateral",
  "returning", "symmetric", "tablesample", "variadic", "window",
]

removed_types = [
  "bigserial", "bit", "bit varying", "box", "bytea", "cidr", "circle", "daterange", "inet",
  "int4range", "int8range", "json", "jsonb", "line", "lseg", "macaddr", "money", "numrange",
  "path", "point", "polygon", "serial", "smallserial", "tsquery", "tsrange", "tstzrange",
  "tsvector", "uuid", "xml",
]

removed_functions = [
  "array_agg", "array_length", "concat_ws", "currval", "gen_random_uuid", "json_agg",
  "jsonb_agg", "jsonb_array_elements", "jsonb_build_object", "jsonb_extract_path_text",
  "nextval", "string_agg", "unnest",
]

[[functions]]
name = "concat"
signatures = ["concat(value1 varchar, value2 varchar) -> varchar"]
doc = "Concatenation of exactly two strings (use `||` for more)."

[[functions]]
name = "regexp_replace"
signatures = ["regexp_replace(source varchar, pattern varchar) -> varchar", "regexp_replace(source varchar, pattern varchar, replace_string varchar) -> varchar", "regexp_replace(source varchar, pattern varchar, replace_string varchar, position int) -> varchar", "regexp_replace(source varchar, pattern varchar, replace_string varchar, position int, parameters varchar) -> varchar"]
doc = "Replaces substrings matching a POSIX regular expression."

[[functions]]
name = "regexp_substr"
signatures = ["regexp_substr(source varchar, pattern varchar) -> varchar", "regexp_substr(source varchar, pattern varchar, position int) -> varchar", "regexp_substr(source varchar, pattern varchar, position int, occurrence int) -> varchar", "regexp_substr(source varchar, pattern varchar, position int, occurrence int, parameters varchar) -> varchar"]
doc = "Substring matching a regular expression."

[[functions]]
name = "regexp_count"
signatures = ["regexp_count(source varchar, pattern varchar) -> int", "regexp_count(source varchar, pattern varchar, position int) -> int", "regexp_count(source varchar, pattern varchar, position int, parameters varchar) -> int"]
doc = "Number of matches of a regular expression."

[[functions]]
name = "regexp_instr"
signatures = ["regexp_instr(source varchar, pattern varchar) -> int", "regexp_instr(source varchar, pattern varchar, position int) -> int", "regexp_instr(source varchar, pattern varchar, position int, occurrence int) -> int", "regexp_instr(source varchar, pattern varchar, position int, occurrence int, option int) -> int", "regexp_instr(source varchar, pattern varchar, position int, occurrence int, option int, parameters varchar) -> int"]
doc = "Position of a regular expression match."

[[functions]]
name = "listagg"
signatures = ["listagg(expression varchar) -> varchar", "listagg(expression varchar, delimiter varchar) -> varchar"]
doc = "Concatenates the group's values (`WITHIN GROUP (ORDER BY ...)` optional)."

[[functions]]
name = "getdate"
signatures = ["getdate() -> timestamp"]
doc = "Current date and time of the current statement (without fractional seconds)."

[[functions]]
name = "nvl"
signatures = ["nvl(expression any, ...) -> any"]
doc = "First non-null expression (same as `COALESCE`)."

[[functions]]
name = "nvl2"
signatures = ["nvl2(expression any, not_null_return any, null_return any) -> any"]
doc = "Second argument when the first is not null, otherwise the third."

[[functions]]
name = "decode"
signatures = ["decode(expression any, search any, result any, ...) -> any"]
doc = "Compares to each search value and returns the matching result (last odd argument is the default)."

[[functions]]
name = "dateadd"
signatures = ["dateadd(datepart varchar, interval int, value timestamp) -> timestamp"]
