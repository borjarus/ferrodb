# Vertica 24.x (columnar MPP analytic database): reserved words, projection/segmentation keywords,
# types and the commonly used built-in functions (string, date/time, analytic, regex, flex/JSON).
id = "vertica"
name = "Vertica"
inherits = "sql"
identifier_quote = '"'
case_folding = "none"
default_schema = "public"
parser = ""

keywords = [
  "analyse", "analyze", "array", "binary", "correlation", "current_database", "current_schema",
  "deferrable", "do", "encoded", "grouped", "initially", "interval", "intervalym", "ksafe",
  "limit", "localtime", "localtimestamp", "match", "minus", "new", "nullsequal", "off",
  "offset", "old", "only", "pinned", "placing", "projection", "schema", "segmented",
  "session_user", "sysdate", "timeseries", "unbounded", "unsegmented", "user", "window",
  "within",
]

soft_keywords = [
  "abort", "access", "auto", "block_dict", "blockdict_comp", "bzip_comp", "commondelta_comp",
  "copy", "define", "delimiter", "deltarange_comp", "deltaval", "depot", "direct", "enclosed",
  "encoding", "event", "exceptions", "exclude", "export", "flex", "gcddelta", "gzip_comp",
  "hash", "identity", "ilike", "include", "label", "location", "lock", "merge", "modularhash",
  "nodes", "parquet", "pattern", "policy", "pool", "preserve", "privileges", "profile",
  "rejected", "rejectmax", "resource", "rle", "skip", "storage", "subcluster", "tablesample",
  "zstd_comp", "zstd_fast_comp", "zstd_high_comp",
]

types = [
  "binary", "bytea", "char varying", "character varying", "datetime", "float8", "geography",
  "geometry", "int8", "interval day to second", "interval year to month", "long varbinary",
  "long varchar", "money", "number", "raw", "row", "set", "smalldatetime",
  "time with time zone", "timestamp with time zone", "timestamptz", "timetz", "tinyint",
  "uuid", "varbinary",
]

