name = "last_query_id"
signatures = ["last_query_id() -> varchar", "last_query_id(num int) -> varchar"]
doc = "Id of a previous query of the session (-1 = last)."

[[functions]]
name = "last_transaction"
signatures = ["last_transaction() -> varchar"]
doc = "Id of the last committed or rolled back transaction."

[[functions]]
name = "is_role_in_session"
signatures = ["is_role_in_session(role varchar) -> boolean"]
doc = "True if the role is active in the session."

[[functions]]
name = "invoker_role"
signatures = ["invoker_role() -> varchar"]
doc = "Role that invoked the current object (for masking/row access policies)."
