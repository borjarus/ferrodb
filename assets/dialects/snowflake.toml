# Snowflake (current release, 2025-2026): reserved keywords and the commonly used built-in
# functions (conversion, date/time, string, semi-structured, aggregate, window, context).
id = "snowflake"
name = "Snowflake"
inherits = "sql"
identifier_quote = '"'
# Unquoted identifiers are stored in upper case.
case_folding = "upper"
default_schema = "PUBLIC"
parser = "snowflake"

keywords = [
  "account", "connect", "connection", "current", "database", "following", "gscluster",
  "ilike", "increment", "issue", "lateral", "localtime", "localtimestamp", "minus", "of",
  "organization", "qualify", "regexp", "revoke", "rlike", "row", "rows", "sample", "schema",
  "start", "tablesample", "trigger", "try_cast", "view", "whenever", "window",
]

soft_keywords = [
  "alert", "api", "asof", "at", "auto_increment", "autoincrement", "changes", "clone",
  "cluster", "clustering", "comment", "copy", "define", "describe", "dynamic", "external",
  "file", "flatten", "format", "future", "get", "grants", "handler", "iceberg", "identity",
  "ignore", "integration", "language", "list", "ls", "masking", "match_condition",
  "match_recognize", "matched", "measures", "merge", "network", "notification", "packages",
  "pattern", "pipe", "pivot", "policy", "put", "recluster", "remove", "respect", "resume",
  "returns", "role", "runtime_version", "secret", "secure", "share", "show", "stage",
  "storage", "stream", "streamlit", "suspend", "tag", "task", "top", "transient", "undrop",
  "unpivot", "unset", "use", "user", "volatile", "warehouse",
]

types = [
  "array", "binary", "byteint", "datetime", "double", "file", "float4", "float8",
  "geography", "geometry", "number", "object", "string", "text", "timestamp_ltz",
  "timestamp_ntz", "timestamp_tz", "tinyint", "varbinary", "variant", "vector",
]

removed_keywords = [
  "asc", "both", "default", "desc", "end", "except", "fetch", "foreign", "leading", "outer",
  "primary", "references", "trailing",
]

